name: PlantUML Diagrams

on:
  push:
    branches:
      - main
    paths:
      - 'schemas/diagrams/**'
      - 'schemas/**/*.puml'
      - 'schemas/plantuml.yml'
      - '.github/workflows/plantuml.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'schemas/diagrams/**'
      - 'schemas/**/*.puml'
      - 'schemas/plantuml.yml'
      - '.github/workflows/plantuml.yml'
  workflow_dispatch:

# Allow the bot to push generated SVG files back to the repository
permissions:
  contents: write

jobs:
  render-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed for git push back to main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Download PlantUML jar
        run: |
          curl -fsSL -o /tmp/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          echo "PlantUML version:"
          java -jar /tmp/plantuml.jar -version

      - name: Render diagrams to SVG
        run: |
          set -euo pipefail
          echo "Finding .puml files under schemas/diagrams..."
          find schemas/diagrams -name "*.puml" | sort | while read -r file; do
            echo "  → Rendering $file"
            java -jar /tmp/plantuml.jar -tsvg "$file"
          done
          echo "Rendering complete."

      # Upload generated SVGs as artifact on PR and manual runs
      - name: Upload diagrams artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: plantuml-diagrams
          path: schemas/diagrams/**/*.svg
          if-no-files-found: warn

      # On main branch push: commit changed SVGs back to the repo
      # [skip ci] in the commit message prevents an infinite workflow loop
      - name: Commit generated diagrams to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemas/diagrams/**/*.svg
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
          else
            git commit -m "docs: update generated PlantUML diagrams [skip ci]"
            git push
          fi
